name = "qubitor-keepalive"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# No expone rutas HTTP: solo corre por el Cron Trigger.
workers_dev = false

# Logs persistentes en el dashboard de Cloudflare (Workers → qubitor-keepalive → Logs).
[observability]
enabled = true

[triggers]
# Cada 10 minutos entre las 12:00 y las 23:59 UTC, es decir de 9:00 a 20:59 en
# Argentina (UTC-3, sin horario de verano). Render free apaga el servicio tras
# 15 minutos sin tráfico, así que un ping cada 10 lo mantiene despierto en ese
# horario y de noche se deja dormir (se apaga ~00:05 UTC, 15 min tras el último).
#
# Por qué no 24/7: el plan free de Render da 750 horas de instancia por mes por
# workspace, compartidas entre TODOS los web services free. Hay dos servicios
# (API y scan-worker): 2 servicios × 12 h × 31 días = 744 h < 750 h.
# OJO: "0,12-23" serían 13 h de pings (2 × 13 × 31 = 806 h), así que no alcanza.
# Si se suma otro servicio, hay que volver a hacer la cuenta.
crons = ["*/10 12-23 * * *"]

[vars]
# URLs base separadas por coma, sin "/health" (el worker lo agrega).
# La API y el scan-worker (que expone /health si Render le pasa PORT).
TARGETS = "https://qubitor-api.onrender.com,https://<URL-DEL-SCAN-WORKER>.onrender.com"
# Cuánto esperar cada respuesta. Un cold start de Render puede tardar ~50 s;
# aunque se corte antes, el pedido ya despertó al servicio.
TIMEOUT_MS = "30000"
